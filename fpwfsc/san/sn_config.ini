        #the optical model
        rotation angle im (deg) = 0.0
        flip_x = False
        flip_y = False
        
        [[[APERTURE]]]
            aperture = keck
            rotation angle aperture (deg) = 0.0    #6.25
        [[[CORONAGRAPH_MASK]]]
            #vortex or lyot
            type = vortex
            #IWA only used in lyot cas
            IWA_mas = 150.0
            #charge only used in vortex case
            charge = 4
        [[[LYOT_STOP]]]
            lyot stop = NIRC2_incircle_mask
            rotation angle lyot (deg) = 0.0
    
    [[CAMERA_PARAMS]]
        flux = 10000000.0
