[EXECUTION]
    plot = True
    log = False
    logdir = .
    # of iterations
    N iterations = 50
    #setpoint
    x setpoint = 117
    y setpoint = 241
    inner radius = 0
    outer radius = 30

[PID]
    #centroid offset: the quad cell target (0,0 = centered on setpoint pixel)
    x centroid offset = -0.0938
    y centroid offset = -0.6764
    #proportional gain, eg, if centroid error 0.25 --> correct 0.125 if gain = 0.5
    Kp = 0.5
    #integral gain
    Ki = 0.0
    #derivative gain
    Kd = 0.0
    #max PID output in centroid units (quad cell range is roughly -1 to +1)
    output_limits = 0.5

[CAMERA CALIBRATION]
    background file = ""
    masterflat file = ""
    badpix file = ""

[HITCHHIKER MODE]
    #hitchhiker mode looks for files in a directory you provide
    #it will not directly control the camera if enabled.
    hitchhike = True
    #how often to check the output directory for a new file in seconds
    poll interval = 0.5
    #hitchhiker will raise an error and stop trying to centroid if no file is received by this amount of time
    timeout = 120
    #image directory to look for images
    imagedir = /home/mcisse/FPWFSC/fpwfsc/san/sky_data/images

[AO]
    #gain to convert from pixels to TT_OFFSET commands
    tip tilt gain = 0.07
    tip tilt angle (deg) = 90.0
    tip tilt flip x = True
    tip tilt flip y = False
